name: IndexNow Submit — Weekly + Monthly

on:
  schedule:
    - cron: '10 0 * * 1'
    - cron: '10 0 1 * *'
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    env:
      SITE_URL: 'https://freehosts.space'
      indexnow_key: "EdD8dkmdNLlxREi2LkhJjYOH2kyQbJqM3cBKT5fX"
      INDEXNOW_ENDPOINT: 'https://api.indexnow.org/indexnow'
      MAX_ATTEMPTS: '2'
      RETRY_ON_202_DELAY_SEC: '30'

    steps:
      - name: Checkout current branch (full history)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Submit changed URLs to IndexNow
        run: |
          cat <<'JS' > submit-indexnow.js
          const fs = require('fs');
          const { execSync } = require('child_process');

          const SITE_URL = process.env.SITE_URL;
          const INDEXNOW_KEY = process.env.indexnow_key;
          const INDEXNOW_ENDPOINT = process.env.INDEXNOW_ENDPOINT;
          const CURRENT_BRANCH = process.env.GITHUB_REF_NAME;
          const MAX_ATTEMPTS = parseInt(process.env.MAX_ATTEMPTS || '5');
          const RETRY_ON_202_DELAY_MS = (parseInt(process.env.RETRY_ON_202_DELAY_SEC || '30') * 1000);

          if (!SITE_URL || !INDEXNOW_KEY || !CURRENT_BRANCH) { console.error('SITE_URL, INDEXNOW_KEY, or CURRENT_BRANCH missing'); process.exit(1); }

          function extractLocs(xml) {
            const locs = [];
            const re = /<loc>([\s\S]*?)<\/loc>/gi;
            let m;
            while ((m = re.exec(xml)) !== null) locs.push(m[1].trim().replace(/&amp;/g,'&'));
            return locs;
          }

          function toPath(url) {
            try { const u = new URL(url); return u.pathname + (u.search || ''); }
            catch { return url.replace(SITE_URL, ''); }
          }

          let currentXml;
          try { currentXml = fs.readFileSync('public/sitemap.xml','utf8'); } catch { console.log('Sitemap not found, skipping'); process.exit(0); }
          const currentLocs = extractLocs(currentXml).map(toPath);

          const sevenDaysAgo = new Date(Date.now() - 7*24*60*60*1000);
          const isoBefore = sevenDaysAgo.toISOString();
          let commitBefore = '';
          try { execSync(`git fetch --prune origin "${CURRENT_BRANCH}:${CURRENT_BRANCH}"`, {stdio:'ignore'}); commitBefore = execSync(`git rev-list -n 1 --before="${isoBefore}" "${CURRENT_BRANCH}"`).toString().trim(); } catch {}
          let previousLocs = [];
          if (commitBefore) {
            try { previousLocs = extractLocs(execSync(`git show ${commitBefore}:public/sitemap.xml`, {encoding:'utf8'})).map(toPath); } catch {}
          }

          const today = new Date();
          const isFirstOfMonth = today.getUTCDate() === 1;
          const prevSet = new Set(previousLocs);
          const pathsToSubmit = isFirstOfMonth ? currentLocs : currentLocs.filter(p => !prevSet.has(p));

          if (!pathsToSubmit.length) { console.log('No URLs to submit'); process.exit(0); }

          const absoluteUrls = pathsToSubmit.map(p => SITE_URL.replace(/\/$/,'') + p);
          const host = new URL(SITE_URL).host;
          const payload = { host, key: INDEXNOW_KEY, keyLocation: `${SITE_URL.replace(/\/$/,'')}/${INDEXNOW_KEY}.txt`, urlList: absoluteUrls };

          async function submitOnce(attempt) {
            try {
              const res = await fetch(INDEXNOW_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
              return { status: res.status, body: await res.text() };
            } catch(e){ return { status:null, body: String(e) }; }
          }

          (async () => {
            for (let attempt=1; attempt<=MAX_ATTEMPTS; attempt++){
              const result = await submitOnce(attempt);
              if ([200,201].includes(result.status)) { console.log('✅ IndexNow accepted'); process.exit(0); }
              if (result.status === 202 && attempt<MAX_ATTEMPTS) { console.log(`202 received, retrying after ${RETRY_ON_202_DELAY_MS/1000}s`); await new Promise(r=>setTimeout(r,RETRY_ON_202_DELAY_MS)); continue; }
              if (attempt<MAX_ATTEMPTS) { await new Promise(r=>setTimeout(r,2000*Math.pow(2,attempt-1))); continue; }
              console.error('Submission failed', result.status, result.body); process.exit(1);
            }
          })();
          JS

          node submit-indexnow.js
          rm -f submit-indexnow.js