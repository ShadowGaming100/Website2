name: Update Sitemap

on:
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM UTC
  workflow_dispatch:

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: website

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate and update sitemap & robots.txt
        run: |
          cat <<'JS' > generate-sitemap.js
          const https = require('https');
          const fs = require('fs');

          const SITE_URL = 'https://freehosts.space';
          const API_URL = 'https://api.freehosts.space';

          // Static routes — keep in sync with the app/  directory
          const STATIC_ROUTES = [
            '/',
            '/hosts',
            '/about',
            '/faq',
            '/staff',
            '/submit-host',
            '/submit-layout',
            '/submission-rules',
            '/server-rules',
            '/other-free-hosts',
            '/tos',
            '/privacy-policy',
          ];

          // Slugify — must match lib/slugify.ts exactly
          function slugify(name) {
            return name
              .toLowerCase()
              .replace(/\s+/g, '-')
              .replace(/[^a-z0-9-]/g, '')
              .replace(/-{2,}/g, '-')
              .replace(/^-+|-+$/g, '');
          }

          function fetchHosts() {
            return new Promise((resolve, reject) => {
              https.get(API_URL + '/api/hosts?limit=1000', (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const jsonData = JSON.parse(data);
                    resolve(Array.isArray(jsonData.data) ? jsonData.data : []);
                  } catch (e) {
                    reject(e);
                  }
                });
              }).on('error', reject);
            });
          }

          function generateSitemap(hosts) {
            const today = new Date().toISOString().split('T')[0];

            // Start with static routes, then append one slug URL per host
            const urls = [...STATIC_ROUTES];

            hosts.forEach(host => {
              if (host && host.name) {
                const slug = slugify(host.name);
                if (slug) urls.push(`/hosts/${slug}`);
              }
            });

            // Deduplicate and sort
            const sorted = [...new Set(urls)].sort();

            let sitemap = '<?xml version="1.0" encoding="UTF-8"?>\n' +
                          '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';

            for (const p of sorted) {
              sitemap += `  <url>\n` +
                         `    <loc>${SITE_URL}${p}</loc>\n` +
                         `    <lastmod>${today}</lastmod>\n` +
                         `    <changefreq>weekly</changefreq>\n` +
                         `    <priority>0.8</priority>\n` +
                         `  </url>\n`;
            }

            sitemap += '</urlset>\n';
            return sitemap;
          }

          function generateRobotsTxt() {
            return [
              'User-agent: *',
              'Allow: /',
              '',
              '# Block API endpoints and admin pages',
              'Disallow: /api/',
              'Disallow: /admin/',
              'Disallow: /private/',
              'Disallow: /cgi-bin/',
              'Disallow: /redirect/',
              '',
              `Sitemap: ${SITE_URL}/sitemap.xml`,
              ''
            ].join('\n');
          }

          async function main() {
            try {
              console.log('📡 Fetching hosts from API...');
              const hosts = await fetchHosts();
              console.log('✅ Found ' + hosts.length + ' hosts');

              const sitemap = generateSitemap(hosts);
              const robots = generateRobotsTxt();

              let currentSitemap = '';
              let currentRobots = '';
              try { currentSitemap = fs.readFileSync('public/sitemap.xml', 'utf8'); } catch {}
              try { currentRobots = fs.readFileSync('public/robots.txt', 'utf8'); } catch {}

              let changesMade = false;

              if (currentSitemap !== sitemap) {
                fs.writeFileSync('public/sitemap.xml', sitemap);
                console.log('✅ Sitemap updated');
                changesMade = true;
              } else {
                console.log('ℹ️ Sitemap unchanged');
              }

              if (currentRobots !== robots) {
                fs.writeFileSync('public/robots.txt', robots);
                console.log('✅ Robots.txt updated');
                changesMade = true;
              } else {
                console.log('ℹ️ Robots.txt unchanged');
              }

              if (!changesMade) console.log('🚫 No changes detected');
            } catch (err) {
              console.error('❌ Error:', err && err.message ? err.message : err);
              process.exit(1);
            }
          }

          main();
          JS

          # Run the script
          node generate-sitemap.js

          # Remove the temporary script so it won't be staged/committed
          rm -f generate-sitemap.js

      - name: Check for changes
        id: git-check
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "🤖 Auto-update: Sitemap & robots.txt $(date +'%Y-%m-%d')"
          git push origin website
